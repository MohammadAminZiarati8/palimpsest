# Local dev only. Credentials here are throwaway dev values, never used in production.
# DB only:      docker compose up -d db    (then `dotnet run --project server`)
# DB + server:  docker compose up -d --build   → http://localhost:8080/health
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Game: "Host=db;Port=5432;Database=game;Username=game;Password=game_dev"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
